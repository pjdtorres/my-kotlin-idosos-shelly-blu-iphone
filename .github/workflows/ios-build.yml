name: Verificar app iOS

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar versao do Xcode
        run: xcodebuild -version
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto iOS
        working-directory: iosApp
        run: xcodegen generate
      - name: Compilar para simulador sem assinatura
        working-directory: iosApp
        run: >-
          xcodebuild
          -project IdososAvalonIOS.xcodeproj
          -scheme IdososAvalonIOS
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compilar para iPhone sem assinatura
        working-directory: iosApp
        run: >-
          xcodebuild
          -project IdososAvalonIOS.xcodeproj
          -scheme IdososAvalonIOS
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
      - name: Criar ficheiro IPA
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IdososAvalonIOS.app Payload/
          zip -qry IdososAvalon.ipa Payload
          ls -lh IdososAvalon.ipa
      - name: Disponibilizar IPA para descarregar
        uses: actions/upload-artifact@v4
        with:
          name: IdososAvalon-ipa
          path: iosApp/IdososAvalon.ipa
          retention-days: 14
